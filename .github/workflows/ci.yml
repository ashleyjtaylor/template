name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Lock the GITHUB_TOKEN to least privilege. This file only runs validation;
# the deploy DAG (which needs OIDC) lives in deploy-staging.yml.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Postgres for integration tests. The DB name + creds match the defaults
      # in packages/db/src/env.ts so test code only needs to override DB_NAME.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis for BullMQ integration tests. No AUTH + no TLS — matches
      # docker-compose.yml. Deployed envs use ElastiCache with both enabled
      # (see infra/cdk/lib/data-stack.ts).
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mailpit for email integration tests. Catches SMTP on :1025; the
      # web UI on :8025 is unused in CI. @template/email's MailpitSender
      # talks to localhost:1025 when APP_ENV=local.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: template_test
      REDIS_URL: redis://localhost:6379
      APP_ENV: local
      EMAIL_FROM: noreply@local.test
      MAILPIT_HOST: localhost
      MAILPIT_PORT: 1025
      WEB_BASE_URL: http://localhost:5174
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        run: pnpm --filter @template/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/template_test

      - name: Biome
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: CDK synth
        run: pnpm --filter @template/cdk synth

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commits
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

  build-api-image:
    # PR-only sanity build of the apps/api Docker image so a broken
    # Dockerfile fails the PR. The deploy DAG re-runs this in
    # deploy-staging.yml under the same job name, additionally pushing the
    # image to ECR with a SHA tag.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build API image
        run: |
          docker build \
            --build-arg GIT_SHA=pr-${{ github.event.pull_request.number }} \
            -f apps/api/Dockerfile \
            -t template-api:pr \
            .

  build-worker-image:
    # PR-only sanity build of the apps/worker Docker image — sibling to
    # build-api-image. promote-by-image with two images means both must build
    # green on every PR, so catching breakage here saves a failed deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build worker image
        run: |
          docker build \
            --build-arg GIT_SHA=pr-${{ github.event.pull_request.number }} \
            -f apps/worker/Dockerfile \
            -t template-worker:pr \
            .

  build-internal-app:
    # Sanity-build the apps/internal SPA bundle on PRs so a broken vite build
    # fails the PR rather than only surfacing on the next staging deploy. The
    # deploy DAG re-builds the bundle in deploy-staging.yml — keeping the two
    # callers as siblings (rather than a reusable workflow_call) until a third
    # caller justifies the indirection.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build internal app
        run: pnpm --filter @template/internal build

  build-web-app:
    # Sanity-build the apps/web SPA bundle on PRs. Same shape as
    # build-internal-app — siblings rather than a reusable workflow_call
    # until a third caller justifies the indirection.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @template/web build
