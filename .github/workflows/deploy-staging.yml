name: deploy-staging

# Manual staging deploy. Trigger from the Actions tab when you want to spin
# staging back up after a tear-down, or push the latest main to it. Does NOT
# auto-fire on push — staging is intentionally pull-based so doc/code merges
# don't unintentionally restart torn-down infra. See
# docs/runbooks/staging-teardown-and-redeploy.md.
#
# Operator discipline: trigger only after the green check on main from
# ci.yml. There is no in-workflow gate — see ticket
# docs/tickets/09-ci-workflow-reorg.md for why and when to add one.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-network-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Region must match `aws.region` in infra/cdk/lib/config.ts
          aws-region: eu-west-1

      - name: Deploy network + data stacks
        working-directory: infra/cdk
        # Stack names must match `${PRODUCT}-${env}-*` from infra/cdk/lib/config.ts.
        # `imageTag` is consumed by the migrator + bootstrap-staff task defs in
        # DataStack so they reference the image build-image is about to push.
        run: pnpm exec cdk deploy template-staging-network template-staging-data --require-approval never -c imageTag=${{ github.sha }}

  build-api-image:
    # Builds the apps/api Docker image and pushes it to ECR with a SHA tag.
    # The migrator + bootstrap-staff task defs in DataStack reference this
    # tag at deploy-network-data time (see -c imageTag=… above), so the tag
    # value (github.sha) is the contract between the two jobs.
    if: github.ref == 'refs/heads/main'
    needs: [deploy-network-data]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
      image-uri: ${{ steps.tag.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - id: tag
        # Repo name must match `repositoryName` in infra/cdk/lib/data-stack.ts
        run: |
          TAG=${{ github.sha }}
          URI=${{ steps.ecr.outputs.registry }}/template-staging-api:$TAG
          echo "image-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image-uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -f apps/api/Dockerfile \
            -t ${{ steps.tag.outputs.image-uri }} \
            .
          docker push ${{ steps.tag.outputs.image-uri }}

  build-worker-image:
    # Builds the apps/worker Docker image and pushes to ECR with the same SHA
    # tag as build-api-image. Both images are deployed together by
    # deploy-app-stack (CDK references both ECR repos with the same imageTag
    # context). Promote-by-image with two images: both re-tag together at
    # promotion time so production runs binaries that passed staging together.
    if: github.ref == 'refs/heads/main'
    needs: [deploy-network-data]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - id: tag
        # Repo name must match `repositoryName` for workerRepo in
        # infra/cdk/lib/data-stack.ts.
        run: |
          TAG=${{ github.sha }}
          URI=${{ steps.ecr.outputs.registry }}/template-staging-worker:$TAG
          echo "image-uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -f apps/worker/Dockerfile \
            -t ${{ steps.tag.outputs.image-uri }} \
            .
          docker push ${{ steps.tag.outputs.image-uri }}

  build-internal-app:
    # Builds the apps/internal SPA bundle in parallel with build-image. The
    # artifact is consumed by deploy-internal-spa, which syncs it to the S3
    # origin behind CloudFront and invalidates the index.html cache entry.
    # Each future SPA gets its own build-<name> + deploy-<name>-spa pair.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build internal app
        run: pnpm --filter @template/internal build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: internal-app
          path: apps/internal/dist
          if-no-files-found: error
          retention-days: 7

  build-web-app:
    # Builds the apps/web SPA bundle in parallel with build-internal-app.
    # Consumed by deploy-web-spa, sequenced after deploy-app-stack.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @template/web build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: web-app
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  migrate-db:
    if: github.ref == 'refs/heads/main'
    needs: [build-api-image]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Resolve task def + cluster + network from CFN outputs
        id: cfn
        run: |
          set -e
          TASK_DEF=$(aws cloudformation describe-stacks \
            --stack-name template-staging-data \
            --query 'Stacks[0].Outputs[?OutputKey==`MigratorTaskDefArn`].OutputValue' \
            --output text)
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name template-staging-data \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiClusterName`].OutputValue' \
            --output text)
          LOG_GROUP=$(aws cloudformation describe-stacks \
            --stack-name template-staging-data \
            --query 'Stacks[0].Outputs[?OutputKey==`MigratorLogGroupName`].OutputValue' \
            --output text)
          SUBNETS=$(aws cloudformation describe-stacks \
            --stack-name template-staging-network \
            --query 'Stacks[0].Outputs[?OutputKey==`PrivateSubnetIds`].OutputValue' \
            --output text)
          SG=$(aws cloudformation describe-stacks \
            --stack-name template-staging-network \
            --query 'Stacks[0].Outputs[?OutputKey==`EcsSecurityGroupId`].OutputValue' \
            --output text)
          {
            echo "task-def=$TASK_DEF"
            echo "cluster=$CLUSTER"
            echo "log-group=$LOG_GROUP"
            echo "subnets=$SUBNETS"
            echo "sg=$SG"
          } >> "$GITHUB_OUTPUT"

      - name: Run migrator task and wait for completion
        env:
          TASK_DEF: ${{ steps.cfn.outputs.task-def }}
          CLUSTER: ${{ steps.cfn.outputs.cluster }}
          LOG_GROUP: ${{ steps.cfn.outputs.log-group }}
          SUBNETS: ${{ steps.cfn.outputs.subnets }}
          SG: ${{ steps.cfn.outputs.sg }}
        run: |
          set -eo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Started task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migrator task exited with code $EXIT_CODE"
            echo "--- Last 5 minutes of $LOG_GROUP ---"
            aws logs tail "$LOG_GROUP" --since 5m || true
            exit 1
          fi
          echo "Migrator task completed successfully"

  deploy-app-stack:
    if: github.ref == 'refs/heads/main'
    needs: [migrate-db, build-worker-image]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 11.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy app stack
        working-directory: infra/cdk
        # `imageTag=${{ github.sha }}` matches what `build-api-image` tagged
        # the image with (also `github.sha`). Don't use
        # `needs.build-api-image.outputs` — those aren't reliably preserved
        # when re-running an individual job, which silently produces an empty
        # `imageTag` and a tagless image reference (Docker resolves to
        # `:latest` which we never push).
        run: |
          pnpm exec cdk deploy template-staging-app \
            --exclusively \
            --require-approval never \
            -c imageTag=${{ github.sha }}

  deploy-internal-spa:
    # Sequenced after deploy-app-stack so the CloudFront distribution + S3
    # bucket exist (they're created by app-stack). Sequenced after
    # build-internal-app so the artifact is available to download.
    if: github.ref == 'refs/heads/main'
    needs: [deploy-app-stack, build-internal-app]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: internal-app
          path: apps/internal/dist

      - name: Resolve SPA bucket + CloudFront distribution from CFN outputs
        id: spa
        run: |
          set -e
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`InternalSpaBucketName`].OutputValue' \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`InternalSpaDistributionId`].OutputValue' \
            --output text)
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DIST"
          } >> "$GITHUB_OUTPUT"

      - name: Sync SPA bundle to S3
        env:
          BUCKET: ${{ steps.spa.outputs.bucket }}
        # Two-pass sync: hashed Vite assets get long cache + immutable so
        # browsers / CloudFront keep them indefinitely; index.html gets
        # no-cache so the SPA shell update ships on the next request after
        # deploy. The CloudFront invalidation below covers any users with
        # stale CDN caches.
        run: |
          aws s3 sync apps/internal/dist/ "s3://${BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp apps/internal/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache for index.html
        env:
          DIST: ${{ steps.spa.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths "/" "/index.html"

  deploy-web-spa:
    # Customer-facing SPA. Same two-pass-sync + CF invalidation pattern as
    # deploy-internal-spa; reads its own bucket + distribution from the
    # WebSpa* CFN outputs added by app-stack.
    if: github.ref == 'refs/heads/main'
    needs: [deploy-app-stack, build-web-app]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-app
          path: apps/web/dist

      - name: Resolve SPA bucket + CloudFront distribution from CFN outputs
        id: spa
        run: |
          set -e
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`WebSpaBucketName`].OutputValue' \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`WebSpaDistributionId`].OutputValue' \
            --output text)
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DIST"
          } >> "$GITHUB_OUTPUT"

      - name: Sync SPA bundle to S3
        env:
          BUCKET: ${{ steps.spa.outputs.bucket }}
        run: |
          aws s3 sync apps/web/dist/ "s3://${BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp apps/web/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache for index.html
        env:
          DIST: ${{ steps.spa.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths "/" "/index.html"

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: [deploy-app-stack, deploy-internal-spa, deploy-web-spa]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - id: outputs
        name: Resolve ALB DNS + CloudFront URLs from CFN outputs
        run: |
          set -e
          DNS=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`AlbDnsName`].OutputValue' \
            --output text)
          INTERNAL_URL=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`InternalSpaUrl`].OutputValue' \
            --output text)
          WEB_URL=$(aws cloudformation describe-stacks \
            --stack-name template-staging-app \
            --query 'Stacks[0].Outputs[?OutputKey==`WebSpaUrl`].OutputValue' \
            --output text)
          if [ -z "$DNS" ] || [ -z "$INTERNAL_URL" ] || [ -z "$WEB_URL" ]; then
            echo "Required outputs not found on template-staging-app (got dns='$DNS', internal='$INTERNAL_URL', web='$WEB_URL')"
            exit 1
          fi
          {
            echo "dns=$DNS"
            echo "internal-url=$INTERNAL_URL"
            echo "web-url=$WEB_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Curl /health and verify version matches the deployed sha
        env:
          ALB_DNS: ${{ steps.outputs.outputs.dns }}
          EXPECTED_SHA: ${{ github.sha }}
        # /health hits the ALB direct (CloudFront only routes /api/*), so the
        # smoke target stays the ALB DNS even now that CF fronts the SPA.
        run: |
          set -u
          for i in $(seq 1 30); do
            if RESPONSE=$(curl -fsS --max-time 5 "http://$ALB_DNS/health"); then
              echo "attempt $i: $RESPONSE"
              if echo "$RESPONSE" | jq -e --arg sha "$EXPECTED_SHA" '.status == "ok" and .version == $sha' > /dev/null; then
                echo "API smoke test passed"
                break
              fi
              echo "version mismatch — rolling update may still be in progress"
            else
              echo "attempt $i: /health not yet responding"
            fi
            sleep 10
            if [ "$i" = "30" ]; then
              echo "API smoke test failed after 30 attempts (5 minutes)"
              exit 1
            fi
          done

      - name: Curl each CloudFront distribution and verify the SPA shell is served
        env:
          INTERNAL_URL: ${{ steps.outputs.outputs.internal-url }}
          WEB_URL: ${{ steps.outputs.outputs.web-url }}
        # Asserts each CloudFront distribution serves its SPA shell (the
        # bundles just synced to their S3 buckets). Looks for the
        # <div id="root"> Vite injects into index.html.
        run: |
          set -u
          for label_url in "internal:$INTERNAL_URL" "web:$WEB_URL"; do
            LABEL=${label_url%%:*}
            URL=${label_url#*:}
            for i in $(seq 1 12); do
              if BODY=$(curl -fsS --max-time 10 "$URL/"); then
                if echo "$BODY" | grep -q 'id="root"'; then
                  echo "$LABEL SPA smoke test passed ($URL)"
                  break
                fi
                echo "$LABEL attempt $i: response did not contain id=\"root\""
              else
                echo "$LABEL attempt $i: $URL not yet responding"
              fi
              sleep 10
              if [ "$i" = "12" ]; then
                echo "$LABEL SPA smoke test failed after 12 attempts (2 minutes)"
                exit 1
              fi
            done
          done

      - name: Assert worker service has reached steady state
        # ECS reports the running count once the rolling update finishes. With
        # desiredCount: 1 and the CDK circuitBreaker, a stuck worker would
        # have already failed deploy-app-stack — this is the final
        # confirmation that the binary boots cleanly against Redis + Postgres.
        run: |
          set -eo pipefail
          for i in $(seq 1 30); do
            RUNNING=$(aws ecs describe-services \
              --cluster template-staging \
              --services $(aws ecs list-services --cluster template-staging --query 'serviceArns[?contains(@, `WorkerService`)]|[0]' --output text) \
              --query 'services[0].runningCount' \
              --output text)
            if [ "$RUNNING" = "1" ]; then
              echo "Worker service has 1 running task"
              break
            fi
            echo "attempt $i: worker runningCount=$RUNNING (expected 1)"
            sleep 10
            if [ "$i" = "30" ]; then
              echo "Worker smoke test failed after 30 attempts (5 minutes)"
              exit 1
            fi
          done
