services:
  postgres:
    image: postgres:18-alpine
    container_name: template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template_dev
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ recommends mounting at /var/lib/postgresql so PGDATA
      # lives in a major-version-specific subdir (supports pg_upgrade --link).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: template-redis
    # No password locally. Production ElastiCache uses AUTH token + TLS
    # (rediss://) injected via Secrets Manager — see infra/cdk/lib/data-stack.ts.
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
